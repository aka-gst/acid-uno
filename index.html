<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >

  <meta name="theme-color" content="#070910">

  <title>ACID UNO</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <header class="topbar">
    <div class="logo">
      <b>ACID</b> UNO
    </div>

    <div id="penalty" class="penalty hidden"></div>

    <button id="restart" class="iconButton" aria-label="Новая игра">
      ↻
    </button>
  </header>


  <section id="bot">

    <div class="botTitle">
      <span class="botIcon">🤖</span>

      <div>
        <strong>ACID BOT</strong>
        <div id="botCount">7 карт</div>
      </div>
    </div>

    <div id="botCards"></div>

  </section>


  <main id="table">

    <div class="tableGlow"></div>

    <div id="center">

      <button id="deck" aria-label="Взять карту">
        <span class="deckLogo">
          ACID
          <small>UNO</small>
        </span>

        <span id="deckCount"></span>
      </button>


      <div id="discard"></div>

    </div>

  </main>


  <div id="status">
    ТВОЙ ХОД
  </div>


  <div id="currentColor">
    <span>ЦВЕТ</span>
    <i id="currentColorDot"></i>
  </div>


  <section id="playerArea">

    <div id="hand"></div>

    <div id="playerCount">
      7 карт
    </div>

  </section>

</div>


<!-- ВЫБОР ЦВЕТА -->

<div id="colorPicker" class="overlay hidden">

  <div class="window">

    <h2>ВЫБЕРИ ЦВЕТ</h2>

    <div class="colors">

      <button
        class="pick red"
        data-color="red"
        aria-label="Красный"
      ></button>

      <button
        class="pick yellow"
        data-color="yellow"
        aria-label="Жёлтый"
      ></button>

      <button
        class="pick green"
        data-color="green"
        aria-label="Зелёный"
      ></button>

      <button
        class="pick blue"
        data-color="blue"
        aria-label="Синий"
      ></button>

    </div>

  </div>

</div>


<!-- КОНЕЦ ИГРЫ -->

<div id="endScreen" class="overlay hidden">

  <div class="window endWindow">

    <div class="endAcid">
      ACID UNO
    </div>

    <h1 id="endText">
      ТЫ ВЫИГРАЛ
    </h1>

    <button id="again">
      ЕЩЁ РАЗ
    </button>

  </div>

</div>


<!-- УВЕДОМЛЕНИЕ О ПЕРЕХВАТЕ -->

<div id="interceptFlash" class="interceptFlash hidden">
  <span>✋</span>
  ПЕРЕХВАТ
</div>


<script src="game.js"></script>

</body>
</html>
