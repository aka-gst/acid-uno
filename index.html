<!DOCTYPE html>
<html lang="ru" data-deck="acid">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >

  <meta name="theme-color" content="#08070d">

  <title>ACID UNO</title>

  <link rel="icon" href="favicon.svg?v=81" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=81">
  <link rel="manifest" href="manifest.webmanifest?v=81">

    
  <link rel="stylesheet" href="style.css?v=81">
  <link rel="stylesheet" href="effects.css?v=81">
  <link rel="stylesheet" href="v9.1.css?v=81">
  <link rel="stylesheet" href="features.css?v=81">
  
</head>


<body>

<div id="game">

<!-- ======================================
     АРЕНА: КООРДИНАТНАЯ ПЛОСКОСТЬ
====================================== -->

<div
  id="arena"
  class="arena"
  aria-hidden="true"
>
  <i class="arenaFog"></i>
  <i class="arenaHorizon"></i>
  <i class="arenaFloor"></i>
  <i class="arenaDisc"></i>
</div>


  <!-- ======================================
       BACKGROUND
  ======================================= -->

  <div class="ambient ambientPurple"></div>
  <div class="ambient ambientGreen"></div>
  <div class="noise"></div>


  <!-- ======================================
       TOP BAR
  ======================================= -->

  <header class="topbar">

    <div class="topbarLead">

      <div class="logo">
        <span class="logoAcid">ACID</span>
        <span class="logoUno">UNO</span>
      </div>


      <div
        id="matchClock"
        class="matchClock hidden"
        aria-live="polite"
      >
        1:00
      </div>

    </div>


    <div
      id="penalty"
      class="penalty hidden"
    >
      ШТРАФ +2
    </div>


    <div class="topbarActions">

      <a
        id="homeLink"
        class="iconButton"
        href="../"
        aria-label="На главную"
        data-tip="НА ГЛАВНУЮ"
      >
        <!--
          Не ⌂ (U+2302): в системных шрифтах у него нет
          начертания, и кнопка выглядела пустым квадратом —
          то есть кнопки «на главную» будто и не было.
        -->
        🏠
      </a>


      <button
        id="tableButton"
        class="iconButton"
        aria-label="Стол и игроки"
        data-tip="СТОЛ И ИГРОКИ"
      >
        👥
      </button>


      <button
        id="sound"
        class="iconButton soundButton"
        aria-label="Звук"
        data-tip="ЗВУК"
        aria-pressed="true"
      >
        🔊
      </button>


      <button
        id="restart"
        class="iconButton"
        aria-label="Начать заново"
        data-tip="ЗАНОВО"
      >
        ↻
      </button>

    </div>

  </header>


  <!-- ======================================
       BOT
  ======================================= -->

  <section
    id="bot"
    class="playerZone botZone"
  >

    <div
      id="botTurnGlow"
      class="turnGlow"
    ></div>


    <div class="botTitle">

      <div class="botAvatar">
        <span>🤖</span>
      </div>

      <div class="botInfo">

        <strong>
          ACID BOT
        </strong>

        <div id="botCount">
          7 КАРТ
        </div>

      </div>

    </div>


    <div
      id="botCards"
      class="botCards"
    ></div>

  </section>


  <!-- ======================================
       СОПЕРНИКИ

       Ряд появляется на столе от трёх мест.
       На двоих играет секция #bot выше.
  ======================================= -->

  <div
    id="opponents"
    class="opponents hidden"
  ></div>


  <!-- ======================================
       TABLE
  ======================================= -->

  <main id="table">

    <div class="tableOuterGlow"></div>

    <div class="tableInner">

      <div class="tableGrid"></div>

      <div class="tableLogo">
        ACID
      </div>


      <!-- ОБЪЯВЛЕНИЕ ЦВЕТА ПОСЛЕ ЧЁРНОЙ КАРТЫ -->

      <div
        id="colorFlash"
        class="colorFlash"
        aria-live="polite"
      ></div>


      <!-- ВОЛНА ПО КОЛЬЦАМ АРЕНЫ ОТ СЫГРАННОЙ КАРТЫ -->

      <div
        id="ringPulse"
        class="ringPulse"
        aria-hidden="true"
      ></div>


      <!-- ЗНАК СЫГРАННОЙ СПЕЦКАРТЫ НА ВЕСЬ СТОЛ -->

      <div
        id="cardFlash"
        class="cardFlash"
        aria-hidden="true"
      ></div>


      <!-- НАПРАВЛЕНИЕ ХОДА -->

      <div
        id="direction"
        class="direction hidden"
        aria-hidden="true"
      >
        <!--
          Две ленты-полукольца со стрелками. Лента сходит на нет
          к хвосту и расширяется к наконечнику, поэтому видно,
          в какую сторону идёт ход, даже когда кольцо стоит.
        -->
        <svg
          class="directionArt"
          viewBox="0 0 100 100"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <path class="dirRibbon" d="M 56.40 4.45 A 46.0 46.0 0 0 1 84.18 80.78 L 78.61 75.76 A 38.5 38.5 0 0 0 69.25 16.66 Z" />
          <path class="dirHead" d="M 88.49 83.46 L 71.76 86.22 L 75.28 71.98 Z" />

          <g transform="rotate(180 50 50)">
            <path class="dirRibbon" d="M 56.40 4.45 A 46.0 46.0 0 0 1 84.18 80.78 L 78.61 75.76 A 38.5 38.5 0 0 0 69.25 16.66 Z" />
            <path class="dirHead" d="M 88.49 83.46 L 71.76 86.22 L 75.28 71.98 Z" />
          </g>
        </svg>
      </div>


      <!-- КЛАСТЕР +2 / +4 -->

      <div
        id="stackHUD"
        class="stackHUD hidden"
        aria-live="polite"
      >

        <div class="stackHUDLabel">
          ВОЗЬМЁШЬ
        </div>

        <div
          id="stackHUDValue"
          class="stackHUDValue"
        >
          +4
        </div>

        <div class="stackHUDCards">
          КАРТ
        </div>

      </div>


      <!-- DECK + DISCARD -->

      <div id="center">

        <div class="deckArea">

          <button
            id="deck"
            aria-label="Взять карту"
          >

            <div class="deckBack">

              <span class="deckAcid">
                ACID
              </span>

              <span class="deckUno">
                UNO
              </span>

            </div>

          </button>

          <div id="deckCount">
            0 КАРТ
          </div>

        </div>


        <div
          id="discard"
          class="discardPile"
        ></div>

      </div>

    </div>

  </main>


  <!-- ======================================
       ACTION / STATUS
  ======================================= -->

  <section class="actionHUD">

    <div
      id="actionIcon"
      class="actionIcon hidden"
    ></div>


    <div
      id="status"
      class="status"
    >
      ТВОЙ ХОД
    </div>


    <div
      id="currentColor"
      class="currentColor"
    >

      <span>
        ЦВЕТ
      </span>

      <i
        id="currentColorDot"
        class="colorDot"
      ></i>

      <span
        id="currentColorName"
        class="colorName"
      ></span>

    </div>

  </section>


  <!-- ======================================
       PLAYER
  ======================================= -->

  <section
    id="playerArea"
    class="playerZone playerZoneBottom"
  >

    <div
      id="playerTurnGlow"
      class="turnGlow active"
    ></div>


    <div
      id="hand"
      class="hand"
    ></div>


    <div class="playerHUD">

      <span class="youLabel">
        ТЫ
      </span>

      <span id="playerCount">
        7 КАРТ
      </span>

    </div>

  </section>


  <!-- ======================================
       ANIMATION LAYER

       Все летающие карты создаются здесь.
       Он расположен поверх всей игры.
  ======================================= -->

  <div
    id="animationLayer"
    class="animationLayer"
  ></div>


  <!-- ======================================
       SCREEN FX
  ======================================= -->

  <div
    id="screenFlash"
    class="screenFlash"
  ></div>


  <div
    id="impactRing"
    class="impactRing hidden"
  ></div>


  <!-- ======================================
       BIG ACTION TEXT
  ======================================= -->

  <div
    id="actionBanner"
    class="actionBanner hidden"
  >

    <div
      id="actionBannerIcon"
      class="actionBannerIcon"
    >
      ✋
    </div>

    <div
      id="actionBannerText"
      class="actionBannerText"
    >
      ПЕРЕХВАТ
    </div>

  </div>




<!-- ========================================
     COLOR PICKER
========================================= -->

<div
  id="colorPicker"
  class="overlay hidden"
>

  <div class="window colorWindow">

    <div class="windowEyebrow">
      WILD
    </div>

    <h2>
      ВЫБЕРИ ЦВЕТ
    </h2>


    <!--
      Барабан: четыре сектора одного круга — тот же знак, что
      нарисован на самой чёрной карте. Кнопки остались
      кнопками, поменялась только их форма, поэтому обработчик
      выбора цвета не тронут.
    -->

    <div class="colorWheel" id="colorWheel">

      <button
        class="pick red"
        data-color="red"
        aria-label="Розовый"
      ></button>

      <button
        class="pick yellow"
        data-color="yellow"
        aria-label="Жёлтый"
      ></button>

      <button
        class="pick green"
        data-color="green"
        aria-label="Зелёный"
      ></button>

      <button
        class="pick blue"
        data-color="blue"
        aria-label="Голубой"
      ></button>

      <span
        class="wheelHub"
        id="wheelHub"
        aria-hidden="true"
      >ВЫБЕРИ</span>

    </div>

  </div>

</div>


<!-- ========================================
     LOBBY
========================================= -->

<div
  id="lobby"
  class="overlay hidden"
>

  <div class="window lobbyWindow">

    <div id="lobbyMain">

    <div class="lobbyHead">

      <div class="windowEyebrow">
        ACID UNO
      </div>

      <h2>
        НОВАЯ ИГРА
      </h2>

    </div>


    <!--
      Две двери: сперва выбираешь, с кем играть. Настройки
      стола общие для обоих режимов, поэтому блок один и его
      переносит features.js внутрь выбранной двери — так не
      приходится держать две копии одних и тех же кнопок.
    -->

    <div class="doors" id="doors">

      <section class="door chosen" data-door="bots">

        <button class="doorPick" type="button">
          <b>С БОТАМИ</b>
          <em>стол соберётся сразу</em>
        </button>

        <div class="doorBody">


          <div class="doorSlot">

        <div class="lobbySetup">

          <div class="lobbyRow">

            <span class="lobbyLabel">
              ИГРОКОВ
            </span>

            <div
              id="seatPicker"
              class="seatPicker"
            >

              <button class="seatPick" data-seats="2">2</button>
              <button class="seatPick" data-seats="3">3</button>
              <button class="seatPick" data-seats="4">4</button>
              <button class="seatPick" data-seats="5">5</button>
              <button class="seatPick" data-seats="6">6</button>
              <button class="seatPick" data-seats="7">7</button>

            </div>

          </div>


          <div class="lobbyRow">

            <button
              id="clockToggle"
              class="clockToggle"
              type="button"
              aria-pressed="false"
            >

              <span class="clockToggleBox"></span>

              <span>ИГРАТЬ БЕЗ ТАЙМЕРА</span>

            </button>

          </div>

        </div>

          </div>

          <button id="lobbyStart">
            НАЧАТЬ ПАРТИЮ
            <em>играем прямо сейчас</em>
          </button>

        </div>

      </section>


      <section class="door" data-door="live">

        <button class="doorPick" type="button">
          <b>С ЖИВЫМИ</b>
          <em>по ссылке, с любого устройства</em>
        </button>

        <div class="doorBody">

          <div class="doorSlot"></div>


          <button
            id="lobbyOnline"
            class="lobbyOnline"
            type="button"
          >
            ПОЗВАТЬ ДРУГА ПО ССЫЛКЕ
            <em>дам код и ссылку</em>
          </button>

        </div>

      </section>

    </div>


    <button
      id="rulesOpen"
      class="rulesOpen"
      type="button"
    >
      как играть
    </button>

    </div>


    <!-- КОМНАТА -->

    <div
      id="roomPanel"
      class="roomPanel hidden"
    >

      <div class="windowEyebrow">
        КОМНАТА
      </div>

      <div
        id="roomCode"
        class="roomCode"
      >····</div>

      <button
        id="roomCopy"
        class="roomCopy"
        type="button"
      >
        СКОПИРОВАТЬ ССЫЛКУ
      </button>

      <div
        id="roomPlayers"
        class="roomPlayers"
      ></div>

      <div id="roomTools" class="roomTools">

        <button
          id="roomBotAdd"
          class="roomTool"
          type="button"
        >
          + БОТ
        </button>

        <button
          id="roomBotRemove"
          class="roomTool"
          type="button"
        >
          − БОТ
        </button>

      </div>


      <button
        id="roomStart"
        class="roomStart"
        type="button"
      >
        НАЧАТЬ СЕЙЧАС
      </button>


      <div
        id="roomNote"
        class="lobbyNote"
      ></div>

      <button
        id="roomLeave"
        class="roomLeave"
        type="button"
      >
        ВЫЙТИ
      </button>

    </div>

  </div>

</div>


<!-- ========================================
     END SCREEN
========================================= -->

<div
  id="endScreen"
  class="overlay hidden"
>

  <div class="window endWindow">

    <div class="endAcid">
      ACID UNO
    </div>


    <h1 id="endText">
      ТЫ ВЫИГРАЛ
    </h1>


    <div
      id="endScore"
      class="endScore hidden"
    ></div>


    <div class="endLine"></div>


    <button id="again">
      ЕЩЁ РАЗ
    </button>

  </div>

</div>


<!-- ========================================
     JS

     animations.js обязательно идёт первым.
========================================= -->

<script src="src/assets.js?v=81"></script>
<script src="src/rules.js?v=81"></script>
<script src="src/match.js?v=81"></script>
<script src="src/audio.js?v=81"></script>
<script src="animations.js?v=81"></script>
<script src="src/bot.js?v=81"></script>
<script src="src/transport.js?v=81"></script>
<script src="src/store.js?v=81"></script>
<script src="game.js?v=81"></script>
<script src="v9.1.js?v=81"></script>
<script src="src/features.js?v=81"></script>
<script src="src/room.js?v=81"></script>
<script src="src/tutorial.js?v=81"></script>

</body>
</html>
