<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  >

  <meta name="theme-color" content="#08070d">

  <title>ACID UNO</title>

  <link rel="icon" href="favicon.svg?v=47" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=47">
  <link rel="manifest" href="manifest.webmanifest?v=47">

    
  <link rel="stylesheet" href="style.css?v=47">
  <link rel="stylesheet" href="effects.css?v=47">
  <link rel="stylesheet" href="v9.1.css?v=47">
  <link rel="stylesheet" href="features.css?v=47">
  
</head>


<body>

<div id="game">

  <!-- ======================================
       BACKGROUND
  ======================================= -->

  <div class="ambient ambientPurple"></div>
  <div class="ambient ambientGreen"></div>
  <div class="noise"></div>


  <!-- ======================================
       TOP BAR
  ======================================= -->

  <header class="topbar">

    <div class="topbarLead">

      <div class="logo">
        <span class="logoAcid">ACID</span>
        <span class="logoUno">UNO</span>
      </div>


      <div
        id="matchClock"
        class="matchClock hidden"
        aria-live="polite"
      >
        1:00
      </div>

    </div>


    <div
      id="penalty"
      class="penalty hidden"
    >
      ШТРАФ +2
    </div>


    <div class="topbarActions">

      <button
        id="tableButton"
        class="iconButton"
        aria-label="Стол и игроки"
        data-tip="СТОЛ И ИГРОКИ"
      >
        👥
      </button>


      <button
        id="sound"
        class="iconButton soundButton"
        aria-label="Звук"
        data-tip="ЗВУК"
        aria-pressed="true"
      >
        🔊
      </button>


      <button
        id="restart"
        class="iconButton"
        aria-label="Начать заново"
        data-tip="ЗАНОВО"
      >
        ↻
      </button>

    </div>

  </header>


  <!-- ======================================
       BOT
  ======================================= -->

  <section
    id="bot"
    class="playerZone botZone"
  >

    <div
      id="botTurnGlow"
      class="turnGlow"
    ></div>


    <div class="botTitle">

      <div class="botAvatar">
        <span>🤖</span>
      </div>

      <div class="botInfo">

        <strong>
          ACID BOT
        </strong>

        <div id="botCount">
          7 КАРТ
        </div>

      </div>

    </div>


    <div
      id="botCards"
      class="botCards"
    ></div>

  </section>


  <!-- ======================================
       СОПЕРНИКИ

       Ряд появляется на столе от трёх мест.
       На двоих играет секция #bot выше.
  ======================================= -->

  <div
    id="opponents"
    class="opponents hidden"
  ></div>


  <!-- ======================================
       TABLE
  ======================================= -->

  <main id="table">

    <div class="tableOuterGlow"></div>

    <div class="tableInner">

      <div class="tableGrid"></div>

      <div class="tableLogo">
        ACID
      </div>


      <!-- НАПРАВЛЕНИЕ ХОДА -->

      <div
        id="direction"
        class="direction hidden"
        aria-hidden="true"
      >
        ↻
      </div>


      <!-- КЛАСТЕР +2 / +4 -->

      <div
        id="stackHUD"
        class="stackHUD hidden"
        aria-live="polite"
      >

        <div class="stackHUDLabel">
          ВОЗЬМЁШЬ
        </div>

        <div
          id="stackHUDValue"
          class="stackHUDValue"
        >
          +4
        </div>

        <div class="stackHUDCards">
          КАРТ
        </div>

      </div>


      <!-- DECK + DISCARD -->

      <div id="center">

        <div class="deckArea">

          <button
            id="deck"
            aria-label="Взять карту"
          >

            <div class="deckBack">

              <span class="deckAcid">
                ACID
              </span>

              <span class="deckUno">
                UNO
              </span>

            </div>

          </button>

          <div id="deckCount">
            0 КАРТ
          </div>

        </div>


        <div
          id="discard"
          class="discardPile"
        ></div>

      </div>

    </div>

  </main>


  <!-- ======================================
       ACTION / STATUS
  ======================================= -->

  <section class="actionHUD">

    <div
      id="actionIcon"
      class="actionIcon hidden"
    ></div>


    <div
      id="status"
      class="status"
    >
      ТВОЙ ХОД
    </div>


    <div
      id="currentColor"
      class="currentColor"
    >

      <span>
        ЦВЕТ
      </span>

      <i
        id="currentColorDot"
        class="colorDot"
      ></i>

    </div>

  </section>


  <!-- ======================================
       PLAYER
  ======================================= -->

  <section
    id="playerArea"
    class="playerZone playerZoneBottom"
  >

    <div
      id="playerTurnGlow"
      class="turnGlow active"
    ></div>


    <div
      id="hand"
      class="hand"
    ></div>


    <div class="playerHUD">

      <span class="youLabel">
        ТЫ
      </span>

      <span id="playerCount">
        7 КАРТ
      </span>

    </div>

  </section>


  <!-- ======================================
       ANIMATION LAYER

       Все летающие карты создаются здесь.
       Он расположен поверх всей игры.
  ======================================= -->

  <div
    id="animationLayer"
    class="animationLayer"
  ></div>


  <!-- ======================================
       SCREEN FX
  ======================================= -->

  <div
    id="screenFlash"
    class="screenFlash"
  ></div>


  <div
    id="impactRing"
    class="impactRing hidden"
  ></div>


  <!-- ======================================
       BIG ACTION TEXT
  ======================================= -->

  <div
    id="actionBanner"
    class="actionBanner hidden"
  >

    <div
      id="actionBannerIcon"
      class="actionBannerIcon"
    >
      ✋
    </div>

    <div
      id="actionBannerText"
      class="actionBannerText"
    >
      ПЕРЕХВАТ
    </div>

  </div>




<!-- ========================================
     COLOR PICKER
========================================= -->

<div
  id="colorPicker"
  class="overlay hidden"
>

  <div class="window colorWindow">

    <div class="windowEyebrow">
      WILD
    </div>

    <h2>
      ВЫБЕРИ ЦВЕТ
    </h2>


    <div class="colors">

      <button
        class="pick red"
        data-color="red"
        aria-label="Красный"
      >
        <span></span>
      </button>


      <button
        class="pick yellow"
        data-color="yellow"
        aria-label="Жёлтый"
      >
        <span></span>
      </button>


      <button
        class="pick green"
        data-color="green"
        aria-label="Зелёный"
      >
        <span></span>
      </button>


      <button
        class="pick blue"
        data-color="blue"
        aria-label="Синий"
      >
        <span></span>
      </button>

    </div>

  </div>

</div>


<!-- ========================================
     LOBBY
========================================= -->

<div
  id="lobby"
  class="overlay hidden"
>

  <div class="window lobbyWindow">

    <div id="lobbyMain">

    <div class="windowEyebrow">
      ACID UNO
    </div>

    <h2>
      НОВАЯ ИГРА
    </h2>


    <!-- НАСТРОЙКА -->

    <div class="lobbySetup">

      <div class="lobbyRow">

        <span class="lobbyLabel">
          ИГРОКОВ
          <em>всего за столом, считая тебя</em>
        </span>

        <div
          id="seatPicker"
          class="seatPicker"
        >

          <button class="seatPick" data-seats="2">2</button>
          <button class="seatPick" data-seats="3">3</button>
          <button class="seatPick" data-seats="4">4</button>
          <button class="seatPick" data-seats="5">5</button>
          <button class="seatPick" data-seats="6">6</button>
          <button class="seatPick" data-seats="7">7</button>

        </div>

      </div>


      <div class="lobbyRow">

        <span class="lobbyLabel">
          КОЛОДА
          <em>как выглядят карты</em>
        </span>

        <div
          id="deckPicker"
          class="deckPicker"
        >

          <button
            class="deckPick"
            data-deck="classic"
            type="button"
          >
            КЛАССИКА
          </button>

          <button
            class="deckPick"
            data-deck="acid"
            type="button"
          >
            КИСЛОТА
          </button>

        </div>

      </div>


      <div class="lobbyRow">

        <span class="lobbyLabel">
          ВРЕМЯ
          <em>кто не успел — считаем очки</em>
        </span>

        <button
          id="clockToggle"
          class="clockToggle"
          type="button"
          aria-pressed="false"
        >

          <span class="clockToggleBox"></span>

          <span>ИГРАТЬ БЕЗ ТАЙМЕРА</span>

        </button>

        <div
          id="lobbyNote"
          class="lobbyNote"
        ></div>

      </div>

    </div>


    <!-- ДЕЙСТВИЕ -->

    <div class="lobbyHint">
      ВЫБЕРИ, С КЕМ ИГРАТЬ
    </div>


    <button id="lobbyStart">
      ИГРАТЬ С БОТАМИ
      <em>начнём сразу</em>
    </button>


    <button
      id="lobbyOnline"
      class="lobbyOnline"
      type="button"
    >
      ПОЗВАТЬ ДРУГА ПО ССЫЛКЕ
      <em>дам код и ссылку, ждём живых</em>
    </button>


    <button
      id="rulesOpen"
      class="rulesOpen"
      type="button"
    >
      как играть
    </button>

    </div>


    <!-- КОМНАТА -->

    <div
      id="roomPanel"
      class="roomPanel hidden"
    >

      <div class="windowEyebrow">
        КОМНАТА
      </div>

      <div
        id="roomCode"
        class="roomCode"
      >····</div>

      <button
        id="roomCopy"
        class="roomCopy"
        type="button"
      >
        СКОПИРОВАТЬ ССЫЛКУ
      </button>

      <div
        id="roomPlayers"
        class="roomPlayers"
      ></div>

      <div id="roomTools" class="roomTools">

        <button
          id="roomBotAdd"
          class="roomTool"
          type="button"
        >
          + БОТ
        </button>

        <button
          id="roomBotRemove"
          class="roomTool"
          type="button"
        >
          − БОТ
        </button>

      </div>


      <button
        id="roomStart"
        class="roomStart"
        type="button"
      >
        НАЧАТЬ СЕЙЧАС
      </button>


      <div
        id="roomNote"
        class="lobbyNote"
      ></div>

      <button
        id="roomLeave"
        class="roomLeave"
        type="button"
      >
        ВЫЙТИ
      </button>

    </div>

  </div>

</div>


<!-- ========================================
     END SCREEN
========================================= -->

<div
  id="endScreen"
  class="overlay hidden"
>

  <div class="window endWindow">

    <div class="endAcid">
      ACID UNO
    </div>


    <h1 id="endText">
      ТЫ ВЫИГРАЛ
    </h1>


    <div
      id="endScore"
      class="endScore hidden"
    ></div>


    <div class="endLine"></div>


    <button id="again">
      ЕЩЁ РАЗ
    </button>

  </div>

</div>


<!-- ========================================
     JS

     animations.js обязательно идёт первым.
========================================= -->

<script src="src/rules.js?v=47"></script>
<script src="src/match.js?v=47"></script>
<script src="src/audio.js?v=47"></script>
<script src="animations.js?v=47"></script>
<script src="src/bot.js?v=47"></script>
<script src="src/transport.js?v=47"></script>
<script src="src/store.js?v=47"></script>
<script src="game.js?v=47"></script>
<script src="v9.1.js?v=47"></script>
<script src="src/features.js?v=47"></script>
<script src="src/room.js?v=47"></script>
<script src="src/tutorial.js?v=47"></script>

</body>
</html>
